<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stock Interno BSF</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f3f4f6;
  color: #202124;
}

.contenedor {
  max-width: 560px;
  margin: auto;
  padding: 16px;
}

.cabecera {
  text-align: center;
  margin-bottom: 18px;
}

.cabecera h1 {
  margin-bottom: 4px;
}

.cabecera p {
  margin-top: 0;
  color: #666;
}

.tarjeta {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 14px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.verde {
  background: #188038;
  color: white;
}

.azul {
  background: #1a73e8;
  color: white;
}

.rojo {
  background: #d93025;
  color: white;
}

.gris {
  background: #e8eaed;
  color: #202124;
}

.oculto {
  display: none !important;
}

.pedido-activo {
  background: #e6f4ea;
  border: 1px solid #34a853;
}

.producto {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 14px;
}

.stock {
  font-size: 36px;
  font-weight: bold;
  margin: 4px 0 14px;
}

.dato {
  margin: 8px 0;
  font-size: 17px;
}

.mensaje {
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 15px;
  line-height: 1.4;
}

.mensaje-ok {
  background: #e6f4ea;
  color: #137333;
}

.mensaje-error {
  background: #fce8e6;
  color: #a50e0e;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 10px;
}

.modal-fondo {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.modal {
  background: white;
  width: 100%;
  max-width: 430px;
  border-radius: 14px;
  padding: 22px;
}

.modal h2 {
  margin-top: 0;
}

.cantidad-grande {
  font-size: 30px;
  font-weight: bold;
}

.resultado-stock {
  font-size: 22px;
  font-weight: bold;
}

.estado-uso {
  color: #137333;
  font-weight: bold;
}

.estado-guardada {
  color: #b06000;
  font-weight: bold;
}

.cargando {
  text-align: center;
  font-weight: bold;
}

</style>

</head>


<body>

<div class="contenedor">

  <div class="cabecera">

    <h1>📦 STOCK INTERNO</h1>

    <p>
      Producción BSF
    </p>

  </div>


  <div
    id="mensaje"
    class="oculto">
  </div>


  <!-- ===================================
       INICIO
       =================================== -->

  <div
    id="pantallaInicio"
    class="tarjeta">

    <h2>
      Nuevo pedido
    </h2>


    <label>
      PIN de producción
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="PIN"
    >


    <label>
      Usuario
    </label>

    <input
      id="usuario"
      type="text"
      placeholder="Ej: Facundo"
    >


    <label>
      Número de pedido
    </label>

    <input
      id="pedido"
      type="text"
      placeholder="Ej: 6475"
    >


    <label>
      Cliente
    </label>

    <input
      id="cliente"
      type="text"
      placeholder="Ej: Jardín Espacial"
    >


    <button
      id="btnIniciar"
      class="verde"
      onclick="iniciarPedido()">
      INICIAR PEDIDO
    </button>

  </div>


  <!-- ===================================
       PEDIDO ACTIVO
       =================================== -->

  <div
    id="pantallaPedido"
    class="oculto">


    <div
      class="tarjeta pedido-activo">

      <strong>
        🟢 PEDIDO ACTIVO
      </strong>

      <div class="dato">
        Pedido:
        <strong id="pedidoActivo"></strong>
      </div>

      <div class="dato">
        Cliente:
        <strong id="clienteActivo"></strong>
      </div>

      <div class="dato">
        Usuario:
        <strong id="usuarioActivo"></strong>
      </div>

      <div class="dato">
        Operación:
        <strong id="operacionActiva"></strong>
      </div>

    </div>


    <!-- ESCANEO -->

    <div
      id="tarjetaEscaneo"
      class="tarjeta">

      <h2>
        Escanear caja
      </h2>

      <button
        id="btnScanner"
        class="azul"
        onclick="abrirScanner()">
        📷 ESCANEAR QR
      </button>


      <div id="reader"></div>


      <button
        id="btnCerrarScanner"
        class="rojo oculto"
        onclick="cerrarScanner()">
        CERRAR CÁMARA
      </button>


      <label>
        O ingresar código
      </label>

      <input
        id="codigoManual"
        type="text"
        placeholder="Ej: CJ-000001"
      >

      <button
        class="gris"
        onclick="buscarCajaManual()">
        BUSCAR CAJA
      </button>

    </div>


    <!-- CARGANDO -->

    <div
      id="cargandoCaja"
      class="tarjeta cargando oculto">

      Consultando caja...

    </div>


    <!-- CAJA -->

    <div
      id="tarjetaCaja"
      class="tarjeta oculto">


      <div
        id="productoCaja"
        class="producto">
      </div>


      <div class="dato">
        Caja:
        <strong id="codigoCaja"></strong>
      </div>


      <div class="dato">
        Estado:
        <span id="estadoCaja"></span>
      </div>


      <div class="dato">
        Stock actual:
      </div>


      <div
        id="stockCaja"
        class="stock">
      </div>


      <label>
        Packings a descontar
      </label>

      <input
        id="cantidadDescontar"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
        placeholder="Ej: 4"
      >


      <button
        id="btnPreparar"
        class="verde"
        onclick="prepararDescuento()">
        CONFIRMAR DESCUENTO
      </button>


      <button
        class="gris"
        onclick="cambiarCaja()">
        CAMBIAR CAJA
      </button>

    </div>


    <!-- FINALIZAR -->

    <div class="tarjeta">

      <button
        id="btnFinalizar"
        class="rojo"
        onclick="pedirFinalizarPedido()">
        FINALIZAR PEDIDO
      </button>

    </div>

  </div>

</div>


<!-- ===================================
     MODAL CONFIRMAR DESCUENTO
     =================================== -->

<div
  id="modalDescuento"
  class="modal-fondo oculto">

  <div class="modal">

    <h2>
      ¿Estás seguro?
    </h2>

    <p>
      Se van a descontar:
    </p>

    <div
      id="modalCantidad"
      class="cantidad-grande">
    </div>

    <p>
      de
      <strong id="modalProducto"></strong>
    </p>


    <div class="dato">
      Caja:
      <strong id="modalCaja"></strong>
    </div>


    <div class="dato">
      Stock actual:
      <strong id="modalAntes"></strong>
    </div>


    <div class="dato">
      Stock resultante:
      <strong
        id="modalDespues"
        class="resultado-stock">
      </strong>
    </div>


    <button
      class="gris"
      onclick="cerrarModalDescuento()">
      CANCELAR
    </button>


    <button
      id="btnDescontar"
      class="verde"
      onclick="ejecutarDescuento()">
      SÍ, DESCONTAR
    </button>

  </div>

</div>


<script>

/*******************************************************
 * CONFIGURACION
 *******************************************************/

const URL_WORKER =
  'https://stock-interno-bsf-api.bsfseeds-com-ar.workers.dev';


const URL_APPS_SCRIPT =
  'https://script.google.com/macros/s/AKfycbzAAJJJhxkTUt99JFfadXQT2IAKmOPS4PKRudeotALBeIAMn60uSktlcty9w9kJv06f/exec';


let operacion =
  null;

let cajaActual =
  null;

let cantidadPendiente =
  0;

let lector =
  null;

let scannerActivo =
  false;

let consultaEnCurso =
  false;

let operacionEnCurso =
  false;


/*******************************************************
 * LLAMAR AL WORKER
 *******************************************************/

async function llamarWorker(
  datos
) {

  const respuesta =
    await fetch(
      URL_WORKER,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'application/json'

        },

        body:
          JSON.stringify(
            datos
          )

      }
    );


  let resultado;


  try {

    resultado =
      await respuesta.json();

  } catch (error) {

    throw new Error(
      'El servidor respondió con un formato inválido.'
    );

  }


  /*
   * Aunque HTTP sea 400/500,
   * queremos mostrar el mensaje
   * real enviado por nuestro backend.
   */
  if (
    !respuesta.ok &&
    !resultado.error
  ) {

    throw new Error(
      'Error del servidor (' +
      respuesta.status +
      ').'
    );

  }


  return resultado;

}


/*******************************************************
 * INICIAR PEDIDO
 *******************************************************/

async function iniciarPedido() {

  ocultarMensaje();


  if (
    operacionEnCurso
  ) {

    return;

  }


  const pin =
    document
      .getElementById(
        'pin'
      )
      .value
      .trim();


  const usuario =
    document
      .getElementById(
        'usuario'
      )
      .value
      .trim();


  const pedido =
    document
      .getElementById(
        'pedido'
      )
      .value
      .trim();


  const cliente =
    document
      .getElementById(
        'cliente'
      )
      .value
      .trim();


  if (
    !pin ||
    !usuario ||
    !pedido ||
    !cliente
  ) {

    mostrarError(
      'Completá PIN, usuario, pedido y cliente.'
    );

    return;

  }


  const boton =
    document.getElementById(
      'btnIniciar'
    );


  operacionEnCurso =
    true;


  boton.disabled =
    true;


  boton.textContent =
    'INICIANDO...';


  try {

    const resultado =
      await llamarWorker({

        accion:
          'iniciarPedido',

        pin:
          pin,

        usuario:
          usuario,

        pedido:
          pedido,

        cliente:
          cliente

      });


    if (
      !resultado.ok
    ) {

      throw new Error(
        resultado.error ||
        'No se pudo iniciar el pedido.'
      );

    }


    operacion = {

      idOperacion:
        resultado.idOperacion,

      pedido:
        resultado.pedido,

      cliente:
        resultado.cliente,

      usuario:
        resultado.usuario,

      estado:
        resultado.estado,

      /*
       * El PIN se mantiene únicamente
       * en memoria mientras el pedido
       * esté abierto.
       */
      pin:
        pin

    };


    document
      .getElementById(
        'pedidoActivo'
      )
      .textContent =
        operacion.pedido;


    document
      .getElementById(
        'clienteActivo'
      )
      .textContent =
        operacion.cliente;


    document
      .getElementById(
        'usuarioActivo'
      )
      .textContent =
        operacion.usuario;


    document
      .getElementById(
        'operacionActiva'
      )
      .textContent =
        operacion.idOperacion;


    document
      .getElementById(
        'pantallaInicio'
      )
      .classList
      .add(
        'oculto'
      );


    document
      .getElementById(
        'pantallaPedido'
      )
      .classList
      .remove(
        'oculto'
      );


    mostrarOk(
      '✅ Pedido iniciado correctamente.'
    );


  } catch (error) {

    mostrarError(
      obtenerMensajeError(
        error
      )
    );

  } finally {

    operacionEnCurso =
      false;


    boton.disabled =
      false;


    boton.textContent =
      'INICIAR PEDIDO';

  }

}


/*******************************************************
 * BUSCAR CAJA MANUALMENTE
 *******************************************************/

function buscarCajaManual() {

  const codigo =
    document
      .getElementById(
        'codigoManual'
      )
      .value
      .trim();


  if (!codigo) {

    mostrarError(
      'Ingresá un código de caja.'
    );

    return;

  }


  consultarCaja(
    codigo
  );

}


/*******************************************************
 * CONSULTAR CAJA
 *
 * Por ahora mantenemos la consulta GET/JSONP
 * que ya funcionaba correctamente.
 *******************************************************/

function consultarCaja(
  codigo
) {

  if (
    consultaEnCurso
  ) {

    return;

  }


  consultaEnCurso =
    true;


  ocultarMensaje();


  document
    .getElementById(
      'tarjetaCaja'
    )
    .classList
    .add(
      'oculto'
    );


  document
    .getElementById(
      'cargandoCaja'
    )
    .classList
    .remove(
      'oculto'
    );


  llamarApiJsonp(
    {

      accion:
        'consultarCaja',

      codigo:
        codigo

    },

    function(datos) {

      consultaEnCurso =
        false;


      document
        .getElementById(
          'cargandoCaja'
        )
        .classList
        .add(
          'oculto'
        );


      if (
        !datos ||
        !datos.ok
      ) {

        mostrarError(
          datos &&
          datos.error
            ? datos.error
            : 'No se pudo consultar la caja.'
        );

        return;

      }


      cajaActual =
        datos.caja;


      mostrarCaja();

    },

    function(error) {

      consultaEnCurso =
        false;


      document
        .getElementById(
          'cargandoCaja'
        )
        .classList
        .add(
          'oculto'
        );


      mostrarError(
        error
      );

    }

  );

}


/*******************************************************
 * MOSTRAR CAJA
 *******************************************************/

function mostrarCaja() {

  document
    .getElementById(
      'productoCaja'
    )
    .textContent =
      cajaActual.producto;


  document
    .getElementById(
      'codigoCaja'
    )
    .textContent =
      cajaActual.codigoCaja;


  document
    .getElementById(
      'stockCaja'
    )
    .textContent =
      cajaActual.cantidadActual;


  const estado =
    document.getElementById(
      'estadoCaja'
    );


  estado.textContent =
    cajaActual.estado;


  estado.className =
    '';


  if (
    String(
      cajaActual.estado
    )
      .trim()
      .toUpperCase() ===
    'EN USO'
  ) {

    estado.classList.add(
      'estado-uso'
    );

  } else {

    estado.classList.add(
      'estado-guardada'
    );

  }


  document
    .getElementById(
      'cantidadDescontar'
    )
    .value =
      '';


  document
    .getElementById(
      'codigoManual'
    )
    .value =
      '';


  document
    .getElementById(
      'tarjetaCaja'
    )
    .classList
    .remove(
      'oculto'
    );

}


/*******************************************************
 * PREPARAR DESCUENTO
 *******************************************************/

function prepararDescuento() {

  ocultarMensaje();


  if (
    !operacion ||
    !cajaActual
  ) {

    mostrarError(
      'No hay una caja seleccionada.'
    );

    return;

  }


  if (
    String(
      cajaActual.estado
    )
      .trim()
      .toUpperCase() !==
    'EN USO'
  ) {

    mostrarError(
      'Esta caja no está EN USO.'
    );

    return;

  }


  const cantidad =
    Number(
      document
        .getElementById(
          'cantidadDescontar'
        )
        .value
    );


  if (
    !Number.isInteger(
      cantidad
    ) ||
    cantidad <= 0
  ) {

    mostrarError(
      'Ingresá una cantidad válida.'
    );

    return;

  }


  if (
    cantidad >
    Number(
      cajaActual.cantidadActual
    )
  ) {

    mostrarError(
      'Stock insuficiente. La caja tiene ' +
      cajaActual.cantidadActual +
      ' packings.'
    );

    return;

  }


  cantidadPendiente =
    cantidad;


  const despues =
    Number(
      cajaActual.cantidadActual
    ) -
    cantidad;


  document
    .getElementById(
      'modalCantidad'
    )
    .textContent =
      cantidad +
      (
        cantidad === 1
          ? ' packing'
          : ' packings'
      );


  document
    .getElementById(
      'modalProducto'
    )
    .textContent =
      cajaActual.producto;


  document
    .getElementById(
      'modalCaja'
    )
    .textContent =
      cajaActual.codigoCaja;


  document
    .getElementById(
      'modalAntes'
    )
    .textContent =
      cajaActual.cantidadActual;


  document
    .getElementById(
      'modalDespues'
    )
    .textContent =
      despues;


  document
    .getElementById(
      'modalDescuento'
    )
    .classList
    .remove(
      'oculto'
    );

}


/*******************************************************
 * EJECUTAR DESCUENTO
 *******************************************************/

async function ejecutarDescuento() {

  if (
    operacionEnCurso ||
    !operacion ||
    !cajaActual ||
    !cantidadPendiente
  ) {

    return;

  }


  const boton =
    document.getElementById(
      'btnDescontar'
    );


  operacionEnCurso =
    true;


  boton.disabled =
    true;


  boton.textContent =
    'DESCONTANDO...';


  try {

    const resultado =
      await llamarWorker({

        accion:
          'descontar',

        pin:
          operacion.pin,

        idOperacion:
          operacion.idOperacion,

        codigoCaja:
          cajaActual.codigoCaja,

        cantidad:
          cantidadPendiente,

        usuario:
          operacion.usuario

      });


    if (
      !resultado.ok
    ) {

      throw new Error(
        resultado.error ||
        'No se pudo realizar el descuento.'
      );

    }


    cerrarModalDescuento();


    mostrarOk(
      '✅ ' +
      resultado.producto +
      ': se descontaron ' +
      resultado.cantidadDescontada +
      (
        resultado.cantidadDescontada === 1
          ? ' packing. '
          : ' packings. '
      ) +
      'Stock ' +
      resultado.cantidadAntes +
      ' → ' +
      resultado.cantidadDespues +
      '. Movimiento ' +
      resultado.idMovimiento +
      '.'
    );


    limpiarCaja();


  } catch (error) {

    mostrarError(
      obtenerMensajeError(
        error
      )
    );

  } finally {

    operacionEnCurso =
      false;


    boton.disabled =
      false;


    boton.textContent =
      'SÍ, DESCONTAR';

  }

}


/*******************************************************
 * MODAL
 *******************************************************/

function cerrarModalDescuento() {

  document
    .getElementById(
      'modalDescuento'
    )
    .classList
    .add(
      'oculto'
    );

}


/*******************************************************
 * CAMBIAR / LIMPIAR CAJA
 *******************************************************/

function cambiarCaja() {

  limpiarCaja();

}


function limpiarCaja() {

  cajaActual =
    null;


  cantidadPendiente =
    0;


  document
    .getElementById(
      'tarjetaCaja'
    )
    .classList
    .add(
      'oculto'
    );


  document
    .getElementById(
      'cantidadDescontar'
    )
    .value =
      '';

}


/*******************************************************
 * FINALIZAR PEDIDO
 *******************************************************/

async function pedirFinalizarPedido() {

  if (
    operacionEnCurso ||
    !operacion
  ) {

    return;

  }


  const confirmar =
    window.confirm(
      '¿Estás seguro de que querés finalizar el pedido ' +
      operacion.pedido +
      '?'
    );


  if (!confirmar) {

    return;

  }


  const boton =
    document.getElementById(
      'btnFinalizar'
    );


  operacionEnCurso =
    true;


  boton.disabled =
    true;


  boton.textContent =
    'FINALIZANDO...';


  try {

    const resultado =
      await llamarWorker({

        accion:
          'finalizarPedido',

        pin:
          operacion.pin,

        idOperacion:
          operacion.idOperacion

      });


    if (
      !resultado.ok
    ) {

      throw new Error(
        resultado.error ||
        'No se pudo finalizar el pedido.'
      );

    }


    await cerrarScanner();


    operacion =
      null;


    cajaActual =
      null;


    cantidadPendiente =
      0;


    document
      .getElementById(
        'pantallaPedido'
      )
      .classList
      .add(
        'oculto'
      );


    document
      .getElementById(
        'pantallaInicio'
      )
      .classList
      .remove(
        'oculto'
      );


    /*
     * Conservamos el usuario para facilitar
     * el siguiente pedido.
     */
    document
      .getElementById(
        'pedido'
      )
      .value =
        '';


    document
      .getElementById(
        'cliente'
      )
      .value =
        '';


    document
      .getElementById(
        'pin'
      )
      .value =
        '';


    mostrarOk(
      '✅ Pedido finalizado correctamente.'
    );


  } catch (error) {

    mostrarError(
      obtenerMensajeError(
        error
      )
    );

  } finally {

    operacionEnCurso =
      false;


    boton.disabled =
      false;


    boton.textContent =
      'FINALIZAR PEDIDO';

  }

}


/*******************************************************
 * SCANNER
 *******************************************************/

async function abrirScanner() {

  ocultarMensaje();


  if (
    scannerActivo
  ) {

    return;

  }


  try {

    lector =
      new Html5Qrcode(
        'reader'
      );


    await lector.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          10,

        qrbox:
          function(
            width,
            height
          ) {

            const minimo =
              Math.min(
                width,
                height
              );


            const tamano =
              Math.floor(
                minimo *
                0.70
              );


            return {

              width:
                tamano,

              height:
                tamano

            };

          }

      },

      function(
        decodedText
      ) {

        if (
          !scannerActivo
        ) {

          return;

        }


        scannerActivo =
          false;


        cerrarScanner()
          .then(
            function() {

              consultarCaja(
                decodedText
              );

            }
          );

      },

      function() {

        /*
         * Ignoramos errores normales
         * mientras busca un QR.
         */

      }

    );


    scannerActivo =
      true;


    document
      .getElementById(
        'btnScanner'
      )
      .disabled =
        true;


    document
      .getElementById(
        'btnCerrarScanner'
      )
      .classList
      .remove(
        'oculto'
      );


  } catch (error) {

    scannerActivo =
      false;


    mostrarError(
      'No se pudo abrir la cámara: ' +
      obtenerMensajeError(
        error
      )
    );

  }

}


/*******************************************************
 * CERRAR SCANNER
 *******************************************************/

async function cerrarScanner() {

  scannerActivo =
    false;


  if (lector) {

    try {

      if (
        lector.isScanning
      ) {

        await lector.stop();

      }

    } catch (error) {}


    try {

      lector.clear();

    } catch (error) {}

  }


  lector =
    null;


  document
    .getElementById(
      'reader'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'btnScanner'
    )
    .disabled =
      false;


  document
    .getElementById(
      'btnCerrarScanner'
    )
    .classList
    .add(
      'oculto'
    );

}


/*******************************************************
 * JSONP
 *
 * SOLO para consultar cajas.
 *******************************************************/

function llamarApiJsonp(
  parametros,
  exito,
  fallo
) {

  const callback =
    'bsfCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      'script'
    );


  let terminado =
    false;


  let timeout =
    null;


  window[
    callback
  ] =
    function(datos) {

      if (
        terminado
      ) {

        return;

      }


      terminado =
        true;


      clearTimeout(
        timeout
      );


      limpiarJsonp(
        script,
        callback
      );


      exito(
        datos
      );

    };


  script.onerror =
    function() {

      if (
        terminado
      ) {

        return;

      }


      terminado =
        true;


      clearTimeout(
        timeout
      );


      limpiarJsonp(
        script,
        callback
      );


      fallo(
        'No se pudo consultar Apps Script.'
      );

    };


  const query =
    new URLSearchParams();


  Object.keys(
    parametros
  )
    .forEach(
      function(clave) {

        query.set(
          clave,
          parametros[clave]
        );

      }
    );


  query.set(
    'callback',
    callback
  );


  query.set(
    '_',
    Date.now()
  );


  script.src =
    URL_APPS_SCRIPT +
    '?' +
    query.toString();


  document.body
    .appendChild(
      script
    );


  timeout =
    setTimeout(
      function() {

        if (
          terminado
        ) {

          return;

        }


        terminado =
          true;


        limpiarJsonp(
          script,
          callback
        );


        fallo(
          'La consulta de la caja tardó demasiado.'
        );

      },
      15000
    );

}


/*******************************************************
 * LIMPIAR JSONP
 *******************************************************/

function limpiarJsonp(
  script,
  callback
) {

  try {

    script.remove();

  } catch (error) {}


  try {

    delete window[
      callback
    ];

  } catch (error) {}

}


/*******************************************************
 * MENSAJES
 *******************************************************/

function mostrarOk(
  texto
) {

  const elemento =
    document.getElementById(
      'mensaje'
    );


  elemento.className =
    'mensaje mensaje-ok';


  elemento.textContent =
    texto;


  window.scrollTo({
    top:
      0,
    behavior:
      'smooth'
  });

}


function mostrarError(
  texto
) {

  const elemento =
    document.getElementById(
      'mensaje'
    );


  elemento.className =
    'mensaje mensaje-error';


  elemento.textContent =
    '⚠️ ' +
    texto;


  window.scrollTo({
    top:
      0,
    behavior:
      'smooth'
  });

}


function ocultarMensaje() {

  document
    .getElementById(
      'mensaje'
    )
    .className =
      'oculto';

}


/*******************************************************
 * ERROR LEGIBLE
 *******************************************************/

function obtenerMensajeError(
  error
) {

  if (!error) {

    return (
      'Error desconocido.'
    );

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  if (
    error.message
  ) {

    return error.message;

  }


  return String(
    error
  );

}
