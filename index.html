<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stock Interno BSF</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 18px;
      color: #202124;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 18px;
    }

    .cabecera h1 {
      margin-bottom: 4px;
      font-size: 28px;
    }

    .cabecera p {
      margin-top: 0;
      color: #666;
    }

    .tarjeta {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .verde {
      background: #188038;
      color: white;
    }

    .azul {
      background: #1a73e8;
      color: white;
    }

    .rojo {
      background: #d93025;
      color: white;
    }

    .gris {
      background: #e8eaed;
      color: #202124;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 8px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 14px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    .resultado {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    .resultado-ok {
      background: #e6f4ea;
      color: #137333;
    }

    .resultado-error {
      background: #fce8e6;
      color: #a50e0e;
    }

    .producto {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .dato {
      margin: 9px 0;
      font-size: 17px;
    }

    .stock {
      font-size: 34px;
      font-weight: bold;
      margin-top: 4px;
    }

    .estado-en-uso {
      color: #137333;
      font-weight: bold;
    }

    .estado-guardada {
      color: #b06000;
      font-weight: bold;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>


<body>

<div class="contenedor">


  <!-- CABECERA -->

  <div class="cabecera">

    <h1>
      📦 STOCK INTERNO
    </h1>

    <p>
      Producción BSF
    </p>

  </div>


  <!-- CONEXION -->

  <div class="tarjeta">

    <h2>
      Estado del sistema
    </h2>

    <button
      id="btnConexion"
      class="verde"
      onclick="probarConexion()">
      🔗 PROBAR CONEXIÓN
    </button>

    <div
      id="resultadoConexion"
      class="resultado">
    </div>

  </div>


  <!-- LECTOR -->

  <div class="tarjeta">

    <h2>
      Escanear caja
    </h2>

    <button
      id="btnAbrir"
      class="azul"
      onclick="abrirScanner()">
      📷 ESCANEAR QR
    </button>

    <div id="reader"></div>

    <button
      id="btnCerrar"
      class="rojo oculto"
      onclick="cerrarScanner()">
      CERRAR CÁMARA
    </button>


    <label>
      O ingresar código manualmente
    </label>

    <input
      id="codigoManual"
      type="text"
      placeholder="Ej: CJ-000001"
    >

    <button
      id="btnBuscar"
      class="gris"
      onclick="buscarCajaManual()">
      BUSCAR CAJA
    </button>

  </div>


  <!-- CARGANDO -->

  <div
    id="cargando"
    class="tarjeta oculto">

    Consultando caja...

  </div>


  <!-- CAJA ENCONTRADA -->

  <div
    id="tarjetaCaja"
    class="tarjeta oculto">

    <div
      id="productoCaja"
      class="producto">
    </div>

    <div class="dato">
      Caja:
      <strong id="codigoCaja"></strong>
    </div>

    <div class="dato">
      Estado:
      <span id="estadoCaja"></span>
    </div>

    <div class="dato">
      Stock actual:
    </div>

    <div
      id="stockCaja"
      class="stock">
    </div>

    <div class="dato">
      Cantidad inicial:
      <strong id="cantidadInicialCaja"></strong>
    </div>

    <div class="dato">
      ID producto:
      <strong id="idProductoCaja"></strong>
    </div>

    <button
      class="azul"
      onclick="escanearOtraCaja()">
      📷 ESCANEAR OTRA CAJA
    </button>

  </div>


  <!-- ERROR -->

  <div
    id="errorGeneral"
    class="resultado resultado-error">
  </div>


</div>


<script>

/*******************************************************
 * CONFIGURACION
 *******************************************************/

const URL_APPS_SCRIPT =
  'https://script.google.com/macros/s/AKfycbzAAJJJhxkTUt99JFfadXQT2IAKmOPS4PKRudeotALBeIAMn60uSktlcty9w9kJv06f/exec';


let lector = null;
let scannerActivo = false;
let consultaEnCurso = false;


/*******************************************************
 * PING
 *******************************************************/

function probarConexion() {

  const boton =
    document.getElementById(
      'btnConexion'
    );

  const resultado =
    document.getElementById(
      'resultadoConexion'
    );


  boton.disabled = true;
  boton.textContent =
    'CONECTANDO...';

  resultado.style.display =
    'none';


  llamarApiJsonp(
    {
      accion: 'ping'
    },

    function(datos) {

      boton.disabled = false;

      boton.textContent =
        '🔗 PROBAR CONEXIÓN';


      if (
        datos &&
        datos.ok
      ) {

        resultado.className =
          'resultado resultado-ok';

        resultado.innerHTML =
          '✅ <strong>' +
          datos.mensaje +
          '</strong><br><br>' +
          datos.fecha;

        resultado.style.display =
          'block';

      } else {

        mostrarError(
          datos &&
          datos.error
            ? datos.error
            : 'La API respondió con un error.'
        );

      }

    },

    function(error) {

      boton.disabled = false;

      boton.textContent =
        '🔗 PROBAR CONEXIÓN';

      mostrarError(
        error
      );

    }
  );

}


/*******************************************************
 * BUSCAR CAJA
 *******************************************************/

function buscarCajaManual() {

  const codigo =
    document.getElementById(
      'codigoManual'
    )
    .value
    .trim();


  if (!codigo) {

    mostrarError(
      'Ingresá un código de caja.'
    );

    return;

  }


  consultarCajaApi(
    codigo
  );

}


/**
 * Consulta una caja usando Apps Script.
 */
function consultarCajaApi(
  codigo
) {

  if (
    consultaEnCurso
  ) {

    return;

  }


  consultaEnCurso =
    true;


  ocultarError();


  document.getElementById(
    'tarjetaCaja'
  ).classList.add(
    'oculto'
  );


  document.getElementById(
    'cargando'
  ).classList.remove(
    'oculto'
  );


  llamarApiJsonp(

    {
      accion:
        'consultarCaja',

      codigo:
        codigo
    },


    function(datos) {

      consultaEnCurso =
        false;


      document.getElementById(
        'cargando'
      ).classList.add(
        'oculto'
      );


      if (
        !datos ||
        !datos.ok
      ) {

        mostrarError(
          datos &&
          datos.error
            ? datos.error
            : 'No se pudo consultar la caja.'
        );

        return;

      }


      mostrarCaja(
        datos.caja
      );

    },


    function(error) {

      consultaEnCurso =
        false;


      document.getElementById(
        'cargando'
      ).classList.add(
        'oculto'
      );


      mostrarError(
        error
      );

    }

  );

}


/*******************************************************
 * MOSTRAR CAJA
 *******************************************************/

function mostrarCaja(
  caja
) {

  if (!caja) {

    mostrarError(
      'Apps Script no devolvió información de la caja.'
    );

    return;

  }


  document.getElementById(
    'productoCaja'
  ).textContent =
    caja.producto;


  document.getElementById(
    'codigoCaja'
  ).textContent =
    caja.codigoCaja;


  const estado =
    document.getElementById(
      'estadoCaja'
    );


  estado.textContent =
    caja.estado;


  estado.className =
    '';


  if (
    String(caja.estado)
      .trim()
      .toUpperCase() ===
    'EN USO'
  ) {

    estado.classList.add(
      'estado-en-uso'
    );

  } else {

    estado.classList.add(
      'estado-guardada'
    );

  }


  document.getElementById(
    'stockCaja'
  ).textContent =
    caja.cantidadActual;


  document.getElementById(
    'cantidadInicialCaja'
  ).textContent =
    caja.cantidadInicial;


  document.getElementById(
    'idProductoCaja'
  ).textContent =
    caja.idProducto;


  document.getElementById(
    'tarjetaCaja'
  ).classList.remove(
    'oculto'
  );


  document.getElementById(
    'codigoManual'
  ).value =
    '';

}


/*******************************************************
 * LECTOR QR
 *******************************************************/

async function abrirScanner() {

  ocultarError();


  if (
    scannerActivo
  ) {

    return;

  }


  try {

    lector =
      new Html5Qrcode(
        'reader'
      );


    await lector.start(

      {
        facingMode:
          'environment'
      },


      {
        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const minimo =
              Math.min(
                width,
                height
              );


            const tamaño =
              Math.floor(
                minimo * 0.70
              );


            return {

              width:
                tamaño,

              height:
                tamaño

            };

          }

      },


      function(
        decodedText
      ) {

        if (
          !scannerActivo
        ) {

          return;

        }


        scannerActivo =
          false;


        /*
         * Primero cerramos cámara.
         */
        cerrarScanner()
          .then(
            function() {

              /*
               * Después consultamos
               * automáticamente la caja.
               */
              consultarCajaApi(
                decodedText
              );

            }
          );

      },


      function() {

        /*
         * Ignoramos los errores normales
         * mientras busca QR.
         */

      }

    );


    scannerActivo =
      true;


    document.getElementById(
      'btnAbrir'
    ).disabled =
      true;


    document.getElementById(
      'btnCerrar'
    ).classList.remove(
      'oculto'
    );


  } catch (error) {

    scannerActivo =
      false;


    mostrarError(
      'No se pudo abrir la cámara: ' +
      obtenerMensajeError(
        error
      )
    );

  }

}


/**
 * Detiene la cámara.
 */
async function cerrarScanner() {

  scannerActivo =
    false;


  if (lector) {

    try {

      if (
        lector.isScanning
      ) {

        await lector.stop();

      }

    } catch (error) {}


    try {

      lector.clear();

    } catch (error) {}

  }


  lector =
    null;


  document.getElementById(
    'reader'
  ).innerHTML =
    '';


  document.getElementById(
    'btnAbrir'
  ).disabled =
    false;


  document.getElementById(
    'btnCerrar'
  ).classList.add(
    'oculto'
  );

}


/**
 * Limpia caja y vuelve al scanner.
 */
function escanearOtraCaja() {

  document.getElementById(
    'tarjetaCaja'
  ).classList.add(
    'oculto'
  );


  abrirScanner();

}


/*******************************************************
 * JSONP
 *******************************************************/

/**
 * Hace una consulta GET/JSONP
 * hacia Apps Script.
 *
 * Por ahora solo la usamos
 * para operaciones de lectura.
 */
function llamarApiJsonp(
  parametros,
  exito,
  fallo
) {

  const nombreCallback =
    'bsfCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      'script'
    );


  let terminado =
    false;


  let timeout =
    null;


  window[
    nombreCallback
  ] =
    function(datos) {

      if (
        terminado
      ) {

        return;

      }


      terminado =
        true;


      if (
        timeout
      ) {

        clearTimeout(
          timeout
        );

      }


      limpiarJsonp(
        script,
        nombreCallback
      );


      exito(
        datos
      );

  };


  script.onerror =
    function() {

      if (
        terminado
      ) {

        return;

      }


      terminado =
        true;


      if (
        timeout
      ) {

        clearTimeout(
          timeout
        );

      }


      limpiarJsonp(
        script,
        nombreCallback
      );


      fallo(
        'No se pudo conectar con Apps Script.'
      );

  };


  const query =
    new URLSearchParams();


  Object.keys(
    parametros
  ).forEach(
    function(clave) {

      query.set(
        clave,
        parametros[clave]
      );

    }
  );


  query.set(
    'callback',
    nombreCallback
  );


  query.set(
    '_',
    Date.now()
  );


  script.src =
    URL_APPS_SCRIPT +
    '?' +
    query.toString();


  document.body.appendChild(
    script
  );


  timeout =
    setTimeout(
      function() {

        if (
          terminado
        ) {

          return;

        }


        terminado =
          true;


        limpiarJsonp(
          script,
          nombreCallback
        );


        fallo(
          'La consulta tardó demasiado.'
        );

      },
      15000
    );

}


/**
 * Limpia callback y script temporal.
 */
function limpiarJsonp(
  script,
  callback
) {

  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  } catch (e) {}


  try {

    delete window[
      callback
    ];

  } catch (e) {}

}


/*******************************************************
 * ERRORES
 *******************************************************/

function mostrarError(
  mensaje
) {

  const elemento =
    document.getElementById(
      'errorGeneral'
    );


  elemento.textContent =
    '⚠️ ' +
    mensaje;


  elemento.style.display =
    'block';

}


function ocultarError() {

  document.getElementById(
    'errorGeneral'
  ).style.display =
    'none';

}


function obtenerMensajeError(
  error
) {

  if (!error) {

    return (
      'Error desconocido.'
    );

  }


  if (
    typeof error ===
    'string'
  ) {

    return error;

  }


  if (
    error.message
  ) {

    return error.message;

  }


  return String(
    error
  );

}

</script>

</body>

</html>
